; PlatformIO Project Configuration File for ESP32-S3-N16R8 MTK BROM Flash Bridge
[platformio]
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Target: 16MB Flash, 8MB Octal PSRAM
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -D MTK_BRIDGE_VERSION=\"1.0.0\"
    -D CONFIG_TRIGGER_PIN=4
    -D CONFIG_RELAY_PIN=5
    -D CONFIG_UART_TX_PIN=17
    -D CONFIG_UART_RX_PIN=18
    -D CONFIG_STATUS_LED_PIN=48

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    links2004/WebSockets @ ^2.4.1
    fastled/FastLED @ ^3.6.0
